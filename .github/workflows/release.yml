name: Release

# Verifies a published release. It does NOT build one.
#
# It used to: CI rebuilt the zip from the tag and refused to publish unless its MD5 matched
# the checksum already committed in manifest.json. That gate never once passed. Every
# difference between the maintainer's machine and the runner became a release-blocking bug,
# and there were four — zip entry mtimes, the git commit SourceLink embeds in the assembly,
# the floating SDK version, and finally the compilation-options blob inside the embedded PDB,
# which records the runtime csc itself ran on. Each fix only revealed the next.
#
# The mistake was building the artifact twice and shipping one of them. release.sh now
# uploads the exact bytes it checksummed, so the manifest and the asset agree by construction
# rather than by coincidence. What is still worth checking is that the three places the
# version is written agree, and that the file behind sourceUrl really is the one the manifest
# promises — which is what an installing client verifies.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (vX.X.X.X)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$raw' is not a four-part version."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      # The assembly version is what Jellyfin shows on the Plugins page and manifest.json is
      # what the catalogue offers. If they disagree the plugin installs and then reports the
      # wrong version forever, and nothing else in the pipeline notices.
      - name: Check the tag matches what the tree says it is
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"

          csproj=$(grep -o '<Version>[^<]*</Version>' JellyfinGraveyardAnalytics/JellyfinGraveyardAnalyticsPlugin.csproj \
            | head -1 | sed 's|<Version>\(.*\)</Version>|\1|')
          yaml=$(grep -o '^version: "[^"]*"' JellyfinGraveyardAnalytics/build.yaml \
            | head -1 | sed 's|version: "\(.*\)"|\1|')

          fail=0
          [ "$csproj" = "$expected" ] || { echo "::error::csproj says $csproj, tag says $expected"; fail=1; }
          [ "$yaml" = "$expected" ]   || { echo "::error::build.yaml says $yaml, tag says $expected"; fail=1; }
          exit $fail

      # The contract itself, checked the way a client checks it: fetch what sourceUrl points
      # at and confirm it is the file the manifest promises. A mismatch means every install of
      # this version fails, which is exactly how v1.2.0.1 was found — by a 404, from a user.
      - name: Check the published asset against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          expected=$(jq -r --arg v "$version" \
            'first(.[0].versions[] | select(.version == $v) | .checksum) // ""' manifest.json)
          url=$(jq -r --arg v "$version" \
            'first(.[0].versions[] | select(.version == $v) | .sourceUrl) // ""' manifest.json)

          if [ -z "$expected" ]; then
            echo "::error::manifest.json has no entry for $version"
            exit 1
          fi

          gh release download "$tag" --pattern 'JellyfinGraveyardAnalytics.zip' --dir asset
          actual=$(md5sum asset/JellyfinGraveyardAnalytics.zip | cut -d' ' -f1)

          echo "manifest : $expected"
          echo "asset    : $actual"
          echo "sourceUrl: $url"

          if [ "$expected" != "$actual" ]; then
            echo "::error::the published asset does not match manifest.json — every install of $version will fail its checksum"
            exit 1
          fi

          # Exactly the two shipped assemblies. Jellyfin already loads SQLite, and a second
          # copy of the native provider in the plugin directory is a load failure.
          unzip -Z1 asset/JellyfinGraveyardAnalytics.zip | sort > /tmp/have
          printf 'Dapper.dll\nJellyfinGraveyardAnalyticsPlugin.dll\n' > /tmp/want
          diff /tmp/want /tmp/have \
            || { echo "::error::the archive is not exactly the two shipped assemblies"; exit 1; }

          echo "✅ $tag is installable: asset matches the manifest and carries the shipped set."
